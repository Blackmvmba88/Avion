<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avion - Godot Integration Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
        }
        
        #container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }
        
        .section {
            background: #2a2a2a;
            border: 2px solid #00ff00;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }
        
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        
        .indicator.connected {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }
        
        .indicator.disconnected {
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }
        
        button {
            background: #00ff00;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #00cc00;
            box-shadow: 0 0 15px #00ff00;
        }
        
        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        input {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 8px;
            border-radius: 4px;
            width: 300px;
        }
        
        .data-display {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
            font-size: 12px;
            overflow-x: auto;
        }
        
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .control-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        label {
            font-weight: bold;
            font-size: 14px;
        }
        
        .slider {
            width: 100%;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .stat-item {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
        }
        
        .stat-label {
            color: #888;
            font-size: 12px;
        }
        
        .stat-value {
            color: #00ff00;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>🛩️ Avion - Godot Integration Demo</h1>
        
        <div class="section">
            <h2>Connection</h2>
            <div class="status">
                <div>
                    <span class="indicator disconnected" id="status-indicator"></span>
                    <span id="status-text">Disconnected</span>
                </div>
                <div>
                    <input type="text" id="server-url" value="ws://localhost:9090" placeholder="WebSocket URL">
                    <button id="connect-btn">Connect</button>
                    <button id="disconnect-btn" disabled>Disconnect</button>
                </div>
            </div>
        </div>
        
        <div class="section">
            <h2>Flight Controls (Simulated)</h2>
            <div class="control-panel">
                <div class="control-item">
                    <label for="pitch-slider">Pitch: <span id="pitch-value">0.0</span></label>
                    <input type="range" id="pitch-slider" class="slider" min="-1" max="1" step="0.1" value="0">
                </div>
                <div class="control-item">
                    <label for="roll-slider">Roll: <span id="roll-value">0.0</span></label>
                    <input type="range" id="roll-slider" class="slider" min="-1" max="1" step="0.1" value="0">
                </div>
                <div class="control-item">
                    <label for="yaw-slider">Yaw: <span id="yaw-value">0.0</span></label>
                    <input type="range" id="yaw-slider" class="slider" min="-1" max="1" step="0.1" value="0">
                </div>
                <div class="control-item">
                    <label for="throttle-slider">Throttle: <span id="throttle-value">0.5</span></label>
                    <input type="range" id="throttle-slider" class="slider" min="0" max="1" step="0.05" value="0.5">
                </div>
            </div>
            <div>
                <button id="reset-btn">Reset Aircraft</button>
                <button id="pause-btn">Pause</button>
                <button id="send-event-btn">Send Test Event</button>
            </div>
        </div>
        
        <div class="section">
            <h2>Statistics</h2>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">Messages Sent</div>
                    <div class="stat-value" id="messages-sent">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Messages Received</div>
                    <div class="stat-value" id="messages-received">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Update Rate</div>
                    <div class="stat-value" id="update-rate">0 Hz</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Running</div>
                    <div class="stat-value" id="running-status">No</div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <h2>Aircraft State (Being Sent to Godot)</h2>
            <div class="data-display" id="aircraft-data">
                { "waiting": "for connection" }
            </div>
        </div>
        
        <div class="section">
            <h2>Console Log</h2>
            <div class="data-display" id="console-log" style="height: 200px; overflow-y: auto;">
                Ready to connect...
            </div>
        </div>
    </div>
    
    <script type="module">
        import { GodotBridge } from '../integrations/GodotBridge.js';
        
        let godotBridge = null;
        let simulatedAircraft = {
            position: { x: 0, y: 100, z: 0 },
            velocity: { x: 50, y: 0, z: 0 },
            rotation: { x: 0, y: 0, z: 0 },
            speed: 50,
            altitude: 100,
            throttle: 0.5
        };
        
        // UI Elements
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const connectBtn = document.getElementById('connect-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const serverUrlInput = document.getElementById('server-url');
        const consoleLog = document.getElementById('console-log');
        
        // Control sliders
        const pitchSlider = document.getElementById('pitch-slider');
        const rollSlider = document.getElementById('roll-slider');
        const yawSlider = document.getElementById('yaw-slider');
        const throttleSlider = document.getElementById('throttle-slider');
        
        // Log function
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff0000' : type === 'success' ? '#00ff00' : '#00ccff';
            consoleLog.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }
        
        // Update status display
        function updateStatus(connected) {
            if (connected) {
                statusIndicator.className = 'indicator connected';
                statusText.textContent = 'Connected to Godot';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                statusIndicator.className = 'indicator disconnected';
                statusText.textContent = 'Disconnected';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }
        
        // Update aircraft display
        function updateAircraftDisplay() {
            document.getElementById('aircraft-data').textContent = 
                JSON.stringify(simulatedAircraft, null, 2);
        }
        
        // Update statistics
        function updateStatistics() {
            if (godotBridge) {
                const status = godotBridge.getStatus();
                document.getElementById('messages-sent').textContent = status.stats.messagesSent;
                document.getElementById('messages-received').textContent = status.stats.messagesReceived;
                document.getElementById('update-rate').textContent = 
                    status.stats.updateRate.toFixed(1) + ' Hz';
                document.getElementById('running-status').textContent = 
                    status.running ? 'Yes' : 'No';
            }
        }
        
        // Connect button
        connectBtn.addEventListener('click', async () => {
            const url = serverUrlInput.value;
            log(`Connecting to ${url}...`);
            
            try {
                godotBridge = new GodotBridge({
                    updateRate: 20,
                    includePhysics: true,
                    includeEnvironment: true,
                    autoStart: true
                });
                
                await godotBridge.initialize(url);
                
                // Set data sources
                godotBridge.setDataSources({
                    aircraft: simulatedAircraft,
                    physics: {
                        getState: () => ({
                            lift: 12000,
                            drag: 800,
                            thrust: 5000,
                            weight: 10000,
                            airspeed: simulatedAircraft.speed,
                            isStalled: false,
                            isOnGround: simulatedAircraft.altitude < 1,
                            gForce: 1.0
                        })
                    },
                    environment: {
                        timeOfDay: 12,
                        windSpeed: 5,
                        windDirection: 270,
                        temperature: 15,
                        pressure: 101325,
                        airDensity: 1.225
                    }
                });
                
                // Handle control inputs from Godot
                godotBridge.onControlInput((data) => {
                    log(`Control input from Godot: ${JSON.stringify(data)}`);
                });
                
                // Handle commands from Godot
                godotBridge.onCommand((data) => {
                    log(`Command from Godot: ${data.command}`, 'success');
                });
                
                updateStatus(true);
                log('Connected successfully!', 'success');
                
            } catch (error) {
                log(`Connection failed: ${error.message}`, 'error');
            }
        });
        
        // Disconnect button
        disconnectBtn.addEventListener('click', () => {
            if (godotBridge) {
                godotBridge.disconnect();
                godotBridge = null;
            }
            updateStatus(false);
            log('Disconnected', 'info');
        });
        
        // Control sliders
        pitchSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            document.getElementById('pitch-value').textContent = value.toFixed(1);
            simulatedAircraft.rotation.x = value * 10;
        });
        
        rollSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            document.getElementById('roll-value').textContent = value.toFixed(1);
            simulatedAircraft.rotation.z = value * 15;
        });
        
        yawSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            document.getElementById('yaw-value').textContent = value.toFixed(1);
            simulatedAircraft.rotation.y = value * 90;
        });
        
        throttleSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            document.getElementById('throttle-value').textContent = value.toFixed(2);
            simulatedAircraft.throttle = value;
            simulatedAircraft.speed = 20 + (value * 80);
        });
        
        // Command buttons
        document.getElementById('reset-btn').addEventListener('click', () => {
            if (godotBridge) {
                godotBridge.sendEvent('reset_requested');
                log('Reset command sent', 'success');
            }
        });
        
        document.getElementById('pause-btn').addEventListener('click', () => {
            if (godotBridge) {
                godotBridge.sendEvent('pause_requested');
                log('Pause command sent', 'success');
            }
        });
        
        document.getElementById('send-event-btn').addEventListener('click', () => {
            if (godotBridge) {
                godotBridge.sendEvent('test_event', {
                    message: 'Hello from Avion!',
                    timestamp: Date.now()
                });
                log('Test event sent', 'success');
            }
        });
        
        // Update loop
        setInterval(() => {
            // Simulate aircraft movement
            simulatedAircraft.position.x += simulatedAircraft.velocity.x * 0.05;
            simulatedAircraft.position.z += simulatedAircraft.velocity.z * 0.05;
            
            updateAircraftDisplay();
            updateStatistics();
        }, 50);
        
        // Initial display
        updateAircraftDisplay();
    </script>
</body>
</html>
